<!doctype html>
<html lang="en" data-theme="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111110">
  <meta name="description" content="A considered space for everything you do. Meet ALO.">
  <title>Hallo Fluency</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #111110;
      --surface: #181817;
      --surface-raised: #201f1d;
      --ink: #f5f2eb;
      --muted: #a7a399;
      --line: rgba(235, 225, 203, .13);
      --accent: #c9ab72;
      --accent-deep: #8c7043;
      --button-ink: #17140f;
      --glow: rgba(198, 169, 112, .12);
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      --radius: 22px;
    }

    [data-theme="white"] {
      color-scheme: light;
      --page: #f5f3ee;
      --surface: #fffefa;
      --surface-raised: #f8f5ee;
      --ink: #25231f;
      --muted: #77736a;
      --line: rgba(60, 53, 38, .13);
      --accent: #97733b;
      --accent-deep: #755a31;
      --button-ink: #fffefa;
      --glow: rgba(151, 115, 59, .1);
    }

    [data-theme="blue"] {
      --page: #101724;
      --surface: #151f2e;
      --surface-raised: #1c293a;
      --ink: #f3f5f7;
      --muted: #a3adba;
      --line: rgba(217, 226, 238, .14);
      --accent: #c7ae7d;
      --accent-deep: #947a4e;
      --button-ink: #111824;
      --glow: rgba(111, 143, 180, .12);
    }

    [data-theme="charcoal"] {
      --page: #18191a;
      --surface: #202224;
      --surface-raised: #292b2d;
      --ink: #f2f1ed;
      --muted: #aaa9a4;
      --line: rgba(235, 235, 230, .13);
      --accent: #d3b77d;
      --accent-deep: #997e4d;
      --button-ink: #171817;
      --glow: rgba(196, 184, 158, .1);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 12%, var(--glow), transparent 38rem),
        var(--page);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      transition: background-color .35s ease, color .35s ease;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .shell { width: min(100% - 36px, 620px); margin-inline: auto; }
    .icon { width: 17px; height: 17px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .profile { padding: 13px 0 52px; }
    .identity { text-align: center; animation: rise-in .7s ease both; }
    .portrait-wrap {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 4px auto 23px;
    }
    .portrait-wrap.is-logo { width: min(100%, 250px); height: auto; aspect-ratio: 600 / 370; }
    .portrait-ring {
      position: absolute;
      inset: -6px;
      border: 1px solid color-mix(in srgb, var(--accent) 78%, transparent);
      border-radius: 50%;
    }
    .portrait-wrap.is-logo .portrait-ring { border-radius: 20px; }
    .portrait-ring::after {
      position: absolute;
      inset: 5px;
      border: 1px solid var(--line);
      border-radius: inherit;
      content: "";
    }
    .portrait {
      width: 100%;
      height: 100%;
      border: 3px solid var(--surface);
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(140deg, #72614a, #252321 58%, #bca371);
      box-shadow: 0 15px 44px rgba(0, 0, 0, .28);
    }
    .portrait-wrap.is-logo .portrait {
      padding: 7px;
      border-radius: 14px;
      object-fit: contain;
      background: #faf9f5;
    }
    .initials {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f2e4c4;
      font-family: var(--serif);
      font-size: 44px;
      letter-spacing: .08em;
      pointer-events: none;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after { width: 16px; height: 1px; background: var(--accent-deep); content: ""; }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(36px, 8vw, 48px);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1.05;
    }
    .title {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .035em;
    }
    .org {
      margin: 8px 0 0;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .09em;
    }
    .bio {
      max-width: 410px;
      margin: 19px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-line;
    }
    .meta-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 11px;
    }
    .meta-item { display: inline-flex; align-items: center; gap: 6px; }
    .meta-item .icon { width: 13px; height: 13px; color: var(--accent); }
    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 23px auto 0;
    }
    .social-link {
      display: inline-flex;
      min-width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      text-decoration: none;
      transition: transform .2s ease, border-color .2s ease, color .2s ease, background .2s ease;
    }
    .social-link .icon { width: 16px; height: 16px; }
    .social-link:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }
    .divider {
      width: 100%;
      height: 1px;
      margin: 34px 0;
      background: linear-gradient(90deg, transparent, var(--line) 18%, var(--line) 82%, transparent);
    }
    .section { margin-top: 34px; animation: rise-in .65s ease both; }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin: 0 0 17px;
    }
    .section-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -.02em;
    }
    .section-note { margin: 0; color: var(--muted); font-size: 11px; }
    .course-list { display: grid; gap: 13px; }
    .course-card {
      display: grid;
      grid-template-columns: 94px 1fr;
      gap: 17px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, var(--surface-raised), var(--surface));
      transition: transform .25s ease, border-color .25s ease;
    }
    .course-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
    .course-image {
      width: 94px;
      height: 100%;
      min-height: 112px;
      max-height: 148px;
      border-radius: 10px;
      object-fit: cover;
      background: linear-gradient(145deg, #4a4234, #1d2022 60%, #88744c);
    }
    .course-body { display: flex; flex-direction: column; align-items: flex-start; padding: 2px 1px 1px 0; }
    .course-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
      color: #9dc39f;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .course-status::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .course-status.closed { color: var(--muted); }
    .course-title { margin: 0; font-family: var(--serif); font-size: 19px; font-weight: 400; line-height: 1.2; }
    .course-description { margin: 6px 0 10px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .course-deadline { margin: auto 0 9px; color: var(--muted); font-size: 10px; }
    .course-deadline:empty { display: none; }
    .course-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .course-action {
      display: inline-flex;
      min-height: 35px;
      align-items: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--button-ink);
      background: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }
    .course-action:hover { transform: translateY(-1px); color: var(--accent); background: transparent; }
    .course-action.secondary { color: var(--accent); background: transparent; }
    .course-action.secondary:hover { color: var(--button-ink); background: var(--accent); }
    .course-action.disabled { border-color: var(--line); color: var(--muted); background: transparent; pointer-events: none; }
    .contact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .contact-link {
      display: flex;
      min-height: 60px;
      align-items: center;
      gap: 11px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface);
      text-decoration: none;
      transition: border-color .2s ease, transform .2s ease;
    }
    .contact-link:hover { transform: translateY(-1px); border-color: var(--accent); }
    .contact-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      color: var(--accent);
      background: var(--glow);
    }
    .contact-icon .icon { width: 15px; height: 15px; }
    .contact-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
    .contact-value { display: block; overflow: hidden; max-width: 100%; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .address-card {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 10px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: var(--surface);
      font-size: 11px;
      line-height: 1.55;
      text-decoration: none;
    }
    .address-card .icon { color: var(--accent); }
    .share-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(120deg, var(--surface-raised), var(--surface));
    }
    .share-copy strong { display: block; font-family: var(--serif); font-size: 18px; font-weight: 400; }
    .share-copy span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .share-actions { display: flex; gap: 8px; }
    .share-button {
      display: inline-flex;
      width: 39px;
      height: 39px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .share-button:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--glow); }
    .site-footer { padding: 5px 0 30px; text-align: center; }
    .footer-brand { color: var(--accent); font-family: var(--serif); font-size: 16px; text-decoration: none; }
    .footer-brand strong { font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: .16em; }
    .copyright { margin: 8px 0 0; color: var(--muted); font-size: 9px; letter-spacing: .04em; }
    .empty-note { padding: 18px; border: 1px dashed var(--line); border-radius: 13px; color: var(--muted); font-size: 12px; text-align: center; }
    .toast {
      position: fixed;
      z-index: 20;
      right: 20px;
      bottom: 20px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface-raised);
      box-shadow: 0 10px 35px rgba(0, 0, 0, .2);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(8, 8, 8, .72);
      backdrop-filter: blur(8px);
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(100%, 560px);
      max-height: min(88vh, 850px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
      animation: rise-in .2s ease both;
    }
    .modal-header {
      position: sticky;
      z-index: 1;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .modal-header h2 { font-size: 21px; }
    .modal-close {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .modal-content { padding: 19px 20px 21px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label, .field-label { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .04em; }
    .field input, .field textarea, .field select {
      width: 100%;
      min-height: 40px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      color: var(--ink);
      background: var(--page);
      font-size: 12px;
      transition: border-color .2s ease;
    }
    .field textarea { min-height: 82px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
    .field select option { color: #24221d; background: #fffefa; }
    .field input[type="file"] { padding: 7px; }
    .help { margin: 1px 0 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .editor-section { margin: 20px 0 8px; padding-top: 18px; border-top: 1px solid var(--line); }
    .editor-section:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
    .editor-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .editor-title strong { font-family: var(--serif); font-size: 18px; font-weight: 400; }
    .editor-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--page);
    }
    .editor-row-title { display: block; overflow: hidden; font-size: 11px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .editor-row-sub { display: block; overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .row-actions { display: flex; align-items: center; gap: 5px; }
    .mini-button {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .mini-button:hover { border-color: var(--accent); color: var(--accent); }
    .mini-button.danger:hover { border-color: #bf7670; color: #bf7670; }
    .mini-button .icon { width: 13px; height: 13px; }
    .switch { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 9px; cursor: pointer; }
    .switch input { width: 15px; min-height: 15px; accent-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .primary-button, .secondary-button {
      min-height: 39px;
      padding: 0 15px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--button-ink);
      background: var(--accent);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }
    .primary-button:hover, .secondary-button:hover { transform: translateY(-1px); }
    .secondary-button { color: var(--ink); background: transparent; border-color: var(--line); }
    .primary-button.compact { min-height: 32px; padding-inline: 12px; font-size: 10px; }
    .notice { margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .notice strong { color: var(--accent); }
    .qr-area { display: grid; place-items: center; min-height: 230px; padding: 12px; }
    .qr-area canvas, .qr-area img { max-width: 100%; padding: 12px; border-radius: 12px; background: #fff; }
    .qr-error { max-width: 320px; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }
    .auth-wrap { max-width: 340px; margin: 4px auto 8px; }
    .auth-wrap .field { margin-bottom: 12px; }
    .auth-wrap .modal-actions { justify-content: center; }
    .auth-hint { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.6; text-align: center; }
    .field-error { min-height: 14px; margin: 7px 0 0; color: #d99184; font-size: 10px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
    @keyframes rise-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) {
      .shell { width: min(100% - 30px, 620px); }
      .portrait-wrap { width: 120px; height: 120px; margin-top: 10px; }
      .profile { padding-top: 12px; }
      .course-card { grid-template-columns: 80px 1fr; gap: 13px; padding: 11px; }
      .course-image { width: 80px; min-height: 106px; }
      .course-title { font-size: 17px; }
      .course-description { font-size: 10px; }
      .contact-grid { gap: 8px; }
      .contact-link { min-height: 56px; gap: 8px; padding: 9px; }
      .contact-icon { width: 30px; height: 30px; }
      .contact-value { font-size: 10px; }
      .share-card { padding: 14px; }
      .section { margin-top: 30px; }
    }
    @media (max-width: 360px) {
      .socials { gap: 8px; }
      .social-link { min-width: 40px; height: 40px; padding-inline: 10px; }
      .contact-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="profile" id="profile-content" aria-live="polite"></main>
    <footer class="site-footer" id="site-footer"></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="modal-close" id="modal-close" type="button" aria-label="Close dialog">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="modal-content" id="modal-content"></div>
    </section>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" class="visually-hidden" aria-hidden="true">
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/><path d="M13 20h7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-location" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>

    <symbol id="i-pinterest" viewBox="0 0 24 24"><path d="M9 21c1.2-1.5 1.4-3 2-5 0 0 .8 1.5 3 1.5 4 0 7-3.7 7-8.3C21 4.5 17 2 12 2 5.5 2 2 6.2 2 10.8c0 2.7 1 5 3.5 5.9.4.2.8 0 .9-.4l.3-1.3c.1-.4.1-.5-.2-.9-.7-.8-1.1-1.8-1.1-3.2 0-4.1 3.1-7.7 8.1-7.7 4.4 0 6.9 2.7 6.9 6.3 0 4.7-2.1 8.7-5.3 8.7-1.8 0-3.1-1.5-2.7-3.3.5-2.2 1.5-4.6 1.5-6.2 0-1.4-.7-2.6-2.2-2.6-1.8 0-3.2 1.9-3.2 4.5 0 1.6.5 2.7.5 2.7L7 21"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1 0l3-3A5 5 0 0 0 13 3l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3A5 5 0 0 0 11 21l1.7-1.7"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></symbol>
  </svg>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "alo-profile-v1";
      const THEME_KEY = "alo-theme-v2";
      const LOCK_KEY = "alo-editor-lock-v1";
      const PLATFORMS = [
        ["Instagram", "instagram"], ["Facebook", "facebook"], ["LinkedIn", "linkedin"],
        ["YouTube", "youtube"], ["WhatsApp", "whatsapp"], ["Telegram", "telegram"],
        ["X (Twitter)", "x"], ["GitHub", "github"], ["Pinterest", "pinterest"], ["Custom", "link"]
      ];
      const ICONS = {
        Instagram: "instagram", Facebook: "facebook", LinkedIn: "linkedin",
        YouTube: "youtube", WhatsApp: "whatsapp",Pinterest: "pinterest", Custom: "link",
        "Call now": "phone", "WhatsApp now": "whatsapp", "Send email": "mail",
        "Visit website": "globe", "Get directions": "map"
      };
      const DEFAULT = {
        profile: {
          name: "Hallo Fluency", title: "Start with hallo. Go beyond",
          bio: "Learn German Online 🇩🇪 🗣️ Speak confidently from Day 1! 📚 A1-B2 Courses & Goethe Exam Prep 🤝 Personalized 1-on-1 & Batch Classes",
            location: "Kochi, Kerala",
          photo: "hallo-fluency-logo.png", initials: "HF"
        },
        socials: [
          { platform: "Instagram", title: "Instagram", url: "https://www.instagram.com/hallofluency_de?cnvx=eTQ0NGJsNzlnenF1", enabled: true },
          { platform: "LinkedIn", title: "LinkedIn", url: "https://www.linkedin.com/in/hallo-fluency-763475450?utm_source=share_via&utm_content=profile&utm_medium=member_android", enabled: true },
          { platform: "Facebook", title: "Facebook", url: "https://www.facebook.com/share/1KHym6pNcs/", enabled: true }
        ],
        courses: [
          {
            type: "exam", title: "Exam Registration", description: "", image: "",
            url: "https://docs.google.com/forms/d/e/1FAIpQLSdLWit0AWPyWUePWquqKHWUQLjufp8rK4uogpaqlws9ixBsIQ/viewform?usp=header",
            deadline: "", status: "Open"
          },
          {
            type: "course", title: "Course Registration", description: "", image: "",
            url: "https://forms.gle/kGjxEMPxuEouoYBu8", deadline: "", status: "Open"
          }
        ],
        contact: {
          phone: "7012305381", whatsapp: "7012305381",
          email: "hallofluency@gmail.com", website: "https://hallofluency.com",
          address: "Kochi, Kerala", maps: ""
        },
        footerUrl: ""
      };

      let state = loadState();
      let theme = validTheme(localStorage.getItem(THEME_KEY)) ? localStorage.getItem(THEME_KEY) : "blue";
      let editorUnlocked = false;
      let toastTimer;
      const root = document.documentElement;
      const profileEl = document.getElementById("profile-content");
      const footerEl = document.getElementById("site-footer");
      const backdrop = document.getElementById("modal-backdrop");
      const modalTitle = document.getElementById("modal-title");
      const modalContent = document.getElementById("modal-content");

      function validTheme(value) { return ["gold", "white", "blue", "charcoal"].includes(value); }
      function clone(value) { return JSON.parse(JSON.stringify(value)); }
      function cleanData(value) {
        const base = clone(DEFAULT);
        if (!value || typeof value !== "object") return base;
        const profile = value.profile && typeof value.profile === "object" ? value.profile : {};
        const contact = value.contact && typeof value.contact === "object" ? value.contact : {};
        const safeString = (v, max = 1200) => typeof v === "string" ? v.slice(0, max) : "";
        base.profile = {
          name: safeString(profile.name, 100) || base.profile.name,
          title: safeString(profile.title, 120), bio: safeString(profile.bio, 700),
          organization: safeString(profile.organization, 100), location: safeString(profile.location, 120),
          photo: safeString(profile.photo, 500000), initials: safeString(profile.initials, 4)
        };
        base.socials = Array.isArray(value.socials) ? value.socials.slice(0, 30).map(link => ({
          platform: PLATFORMS.some(([name]) => name === link.platform) ? link.platform : "Custom",
          title: safeString(link.title, 60), url: safeString(link.url, 2000),
          enabled: link.enabled !== false
        })) : base.socials;
        if (Array.isArray(value.courses)) {
          const storedCourses = value.courses.slice(0, 20);
          const makeCourse = (course, type, url, title) => ({
            type, title: safeString(title, 120), description: safeString(course.description, 500),
            image: safeString(course.image, 500000), url: safeString(url, 2000),
            deadline: safeString(course.deadline, 40),
            status: course.status === "Closed" ? "Closed" : "Open"
          });
          if (storedCourses.some(course => course.type === "exam" || course.type === "course")) {
            base.courses = storedCourses.map(course => makeCourse(
              course, course.type === "exam" ? "exam" : "course", course.url, course.title
            ));
          } else {
            base.courses = storedCourses.flatMap(course => {
              const examUrl = safeString(course.examUrl, 2000);
              const registrationUrl = safeString(course.url, 2000);
              if (!examUrl) return registrationUrl ? [makeCourse(course, "course", registrationUrl, course.title)] : [];
              const entries = [makeCourse(course, "exam", examUrl, course.title || "Exam registration")];
              if (registrationUrl) entries.push(makeCourse(course, "course", registrationUrl, "Course registration"));
              return entries;
            });
          }
        }
        base.contact = {
          phone: safeString(contact.phone, 60), whatsapp: safeString(contact.whatsapp, 60),
          email: safeString(contact.email, 120), website: safeString(contact.website, 2000),
          address: safeString(contact.address, 180), maps: safeString(contact.maps, 2000)
        };
        base.footerUrl = safeString(value.footerUrl, 2000);
        return base;
      }

      function loadState() {
        const params = new URLSearchParams(location.hash.slice(1));
        const shared = params.get("p");
        if (shared) {
          try {
            const json = decodeURIComponent(escape(atob(shared.replace(/-/g, "+").replace(/_/g, "/"))));
            const parsed = JSON.parse(json);
            return cleanData(parsed);
          } catch (error) {
            console.error("Could not read the shared ALO profile.", error);
            showToast("This shared profile link is invalid.");
          }
        }
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? cleanData(JSON.parse(saved)) : clone(DEFAULT);
        } catch (error) {
          console.error("Could not load the saved ALO profile.", error);
          return clone(DEFAULT);
        }
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          console.error("Could not save the ALO profile.", error);
          showToast("Could not save. Remove a large image and try again.");
          return false;
        }
        return true;
      }

      function icon(name, extra = "") {
        return `<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${escapeAttr(name)}"></use></svg>`;
      }
      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }
      function escapeAttr(value) { return escapeHtml(value); }
      function safeUrl(value, allowMail = false) {
        if (!value || typeof value !== "string") return "";
        try {
          const parsed = new URL(value.trim());
          if (parsed.protocol === "https:" || parsed.protocol === "http:") return parsed.href;
          if (allowMail && parsed.protocol === "mailto:") return parsed.href;
          return "";
        } catch { return ""; }
      }
      function phoneDigits(value) { return String(value || "").replace(/[^\d+]/g, ""); }
      function internationalPhone(value) {
        const digits = phoneDigits(value);
        if (/^\d{10}$/.test(digits)) return `+91${digits}`;
        return digits;
      }
      function socialIcon(platform) { return ICONS[platform] || "link"; }
      function openExternal(url) { return `target="_blank" rel="noopener noreferrer" href="${escapeAttr(url)}"`; }
      function render() {
        root.dataset.theme = theme;
        const p = state.profile;
        const isBrandLogo = p.photo === "hallo-fluency-logo.png";
        const hasPhoto = isBrandLogo || (p.photo && safeUrl(p.photo)) || (p.photo && p.photo.startsWith("data:image/"));
        const socials = state.socials.filter(item => item.enabled && safeUrl(item.url));
        const exams = state.courses.filter(course => course.type === "exam" && course.title && safeUrl(course.url));
        const courseRegistrations = state.courses.filter(course => course.type === "course" && course.title && safeUrl(course.url));
        const meta = [
          p.organization ? `<span class="meta-item">${icon("globe")}<span>${escapeHtml(p.organization)}</span></span>` : "",
          p.location ? `<span class="meta-item">${icon("location")}<span>${escapeHtml(p.location)}</span></span>` : ""
        ].filter(Boolean).join("");
        const socialMarkup = socials.length ? `<nav class="socials" aria-label="Social profiles">${socials.map(item =>
          `<a class="social-link" ${openExternal(safeUrl(item.url))} aria-label="${escapeAttr(item.title || item.platform)}">
            ${icon(socialIcon(item.platform))}<span>${escapeHtml(item.title || item.platform)}</span>
          </a>`).join("")}</nav>` : "";
        const renderRegistrationSection = (items, type, heading, id) => {
          const cards = items.length ? items.map(course => {
          const open = course.status === "Open";
          const deadline = course.deadline ? `Registration closes ${escapeHtml(formatDeadline(course.deadline))}` : "";
          const image = course.image && (safeUrl(course.image) || course.image.startsWith("data:image/"))
            ? `<img class="course-image" src="${escapeAttr(course.image)}" alt="" loading="lazy">`
            : `<div class="course-image" role="img" aria-label="Course image"></div>`;
          return `<article class="course-card">
            ${image}
            <div class="course-body">
              <span class="course-status ${open ? "" : "closed"}">${open ? "Registration open" : "Registration closed"}</span>
              <h3 class="course-title">${escapeHtml(course.title)}</h3>
              ${course.description ? `<p class="course-description">${escapeHtml(course.description)}</p>` : ""}
              <p class="course-deadline">${deadline}</p>
              <div class="course-actions">
                <a class="course-action ${type === "exam" ? "secondary" : ""} ${open ? "" : "disabled"}" ${open ? openExternal(safeUrl(course.url)) : 'aria-disabled="true" tabindex="-1" href="#"'}>
                  ${open ? (type === "exam" ? "Exam link" : "Register now") : "Registration closed"}${open ? icon("arrow") : ""}
                </a>
              </div>
            </div>
          </article>`;
          }).join("") : `<div class="empty-note">${type === "exam" ? "Exam registration links will appear here." : "Course registration links will appear here."}</div>`;
          return `<section class="section" aria-labelledby="${id}">
            <div class="section-heading">
              <div><span class="section-kicker">${heading}</span><h2 id="${id}">${heading}</h2></div>
              <p class="section-note">${items.length ? `${items.length} ${items.length === 1 ? "link" : "links"}` : ""}</p>
            </div>
            <div class="course-list">${cards}</div>
          </section>`;
        };
        const c = state.contact;
        const contacts = [
          c.phone ? contactMarkup("Call now", c.phone, `tel:${internationalPhone(c.phone)}`, "phone") : "",
          c.whatsapp ? contactMarkup("WhatsApp now", c.whatsapp, `https://wa.me/${internationalPhone(c.whatsapp).replace(/^\+/, "")}`, "whatsapp") : "",
          c.email ? contactMarkup("Send email", c.email, `mailto:${c.email}`, "mail") : "",
          c.website && safeUrl(c.website) ? contactMarkup("Visit website", displayHost(c.website), safeUrl(c.website), "globe", true) : ""
        ].filter(Boolean).join("");
        const address = c.address ? `<a class="address-card" ${c.maps && safeUrl(c.maps) ? openExternal(safeUrl(c.maps)) : 'href="#" aria-disabled="true" onclick="return false"'}>
          ${icon("map")}<span><span class="contact-label">Get directions</span>${escapeHtml(c.address)}</span>${c.maps && safeUrl(c.maps) ? icon("arrow") : ""}
        </a>` : "";
        profileEl.innerHTML = `
          <section class="identity" aria-labelledby="profile-name">
            <div class="portrait-wrap ${isBrandLogo ? "is-logo" : ""}">
              <span class="portrait-ring" aria-hidden="true"></span>
              ${hasPhoto ? `<img class="portrait" src="${escapeAttr(p.photo)}" alt="${escapeAttr(p.name)}">` : `<div class="portrait" aria-hidden="true"></div><span class="initials" aria-hidden="true">${escapeHtml(p.initials || initials(p.name))}</span>`}
            </div>
            <p class="eyebrow">A little about me</p>
            <h1 id="profile-name">${escapeHtml(p.name)}</h1>
            ${p.title ? `<p class="title">${escapeHtml(p.title)}</p>` : ""}
            ${p.organization ? `<p class="org">${escapeHtml(p.organization)}</p>` : ""}
            ${p.bio ? `<p class="bio">${escapeHtml(p.bio)}</p>` : ""}
            ${meta ? `<div class="meta-row">${meta}</div>` : ""}
            ${socialMarkup}
          </section>
          <div class="divider" aria-hidden="true"></div>
          ${renderRegistrationSection(exams, "exam", "Exam registration", "exam-registration-heading")}
          ${renderRegistrationSection(courseRegistrations, "course", "Course registration", "course-registration-heading")}
          <section class="section" aria-labelledby="contact-heading">
            <div class="section-heading">
              <div><span class="section-kicker">Let's connect</span><h2 id="contact-heading">Get in touch</h2></div>
            </div>
            ${contacts ? `<div class="contact-grid">${contacts}</div>` : `<div class="empty-note">Contact details will appear here.</div>`}
            ${address}
          </section>
          <section class="section" aria-labelledby="share-heading">
            <div class="section-heading">
              <div><span class="section-kicker">Pass it along</span><h2 id="share-heading">Share my profile</h2></div>
            </div>
            <div class="share-card">
              <div class="share-copy"><strong>Good things are better shared.</strong><span>Send this page or scan the code.</span></div>
              <div class="share-actions">
                <button class="share-button" id="copy-share" type="button" aria-label="Copy profile link" title="Copy profile link">${icon("copy")}</button>
                <button class="share-button" id="native-share" type="button" aria-label="Share profile" title="Share profile">${icon("share")}</button>
                <button class="share-button" id="show-qr" type="button" aria-label="Show QR code" title="Show QR code">${icon("qr")}</button>
              </div>
            </div>
          </section>`;
        footerEl.innerHTML = `${state.footerUrl && safeUrl(state.footerUrl)
          ? `<a class="footer-brand" ${openExternal(safeUrl(state.footerUrl))}>Powered by <strong>ALO</strong></a>`
          : `<span class="footer-brand">Powered by <strong>OXIDON-DESIGNERS</strong></span>`}
          <p class="copyright">© 2026 HALLO FLUENCY. All Rights Reserved.</p>`;
        document.getElementById("copy-share").addEventListener("click", copyShareLink);
        document.getElementById("native-share").addEventListener("click", nativeShare);
        document.getElementById("show-qr").addEventListener("click", showQr);
      }
      function contactMarkup(label, value, href, iconName, external = false) {
        return `<a class="contact-link" ${external ? openExternal(href) : `href="${escapeAttr(href)}"`}>
          <span class="contact-icon">${icon(iconName)}</span>
          <span><span class="contact-label">${escapeHtml(label)}</span><span class="contact-value">${escapeHtml(value)}</span></span>
        </a>`;
      }
      function initials(name) {
        return String(name || "").trim().split(/\s+/).slice(0, 2).map(part => part[0] || "").join("").toUpperCase() || "A";
      }
      function displayHost(value) {
        try { return new URL(value).hostname.replace(/^www\./, ""); } catch { return value; }
      }
      function formatDeadline(value) {
        const date = new Date(`${value}T12:00:00`);
        return Number.isNaN(date.getTime()) ? value : new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" }).format(date);
      }
      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
      }
      function openModal(title, content) {
        modalTitle.textContent = title;
        modalContent.innerHTML = content;
        backdrop.classList.add("open");
        document.getElementById("modal-close").focus();
      }
      function closeModal() {
        backdrop.classList.remove("open");
        modalContent.innerHTML = "";
      }
      function shareUrl() {
        const snapshot = clone(state);
        if (snapshot.profile.photo.startsWith("data:image/")) snapshot.profile.photo = "";
        snapshot.courses.forEach(course => {
          if (course.image.startsWith("data:image/")) course.image = "";
        });
        const json = JSON.stringify(snapshot);
        const encoded = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
        const base = location.href.split("#")[0];
        return `${base}#p=${encoded}`;
      }
      async function copyShareLink() {
        try {
          await navigator.clipboard.writeText(shareUrl());
          showToast("Profile link copied.");
        } catch (error) {
          console.error("Could not copy the profile link.", error);
          showToast("Copy is unavailable here. Use your browser's address bar.");
        }
      }
      async function nativeShare() {
        const url = shareUrl();
        if (navigator.share) {
          try { await navigator.share({ title: `${state.profile.name} · ALO`, text: "Here's my ALO profile.", url }); }
          catch (error) { if (error.name !== "AbortError") { console.error("Could not share the profile.", error); showToast("Sharing is unavailable right now."); } }
        } else {
          await copyShareLink();
        }
      }
      function showQr() {
        openModal("Scan to connect", `<div class="qr-area" id="qr-area"><p class="qr-error">Preparing your profile QR code…</p></div><p class="help" style="text-align:center">Scan with your phone camera to open this profile. Uploaded images stay on this device; hosted image URLs are included.</p>`);
        const area = document.getElementById("qr-area");
        const createCode = () => {
          if (typeof QRCode === "undefined") {
            area.innerHTML = `<p class="qr-error">QR code generation could not load. Check your connection, then try again, or use the copy button on the profile.</p>`;
            return;
          }
          try {
            area.innerHTML = "";
            new QRCode(area, { text: shareUrl(), width: 220, height: 220, colorDark: "#17140f", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
          } catch (error) {
            console.error("Could not generate the profile QR code.", error);
            area.innerHTML = `<p class="qr-error">This profile link is too long to fit in a QR code. Try fewer links or share the profile link directly.</p>`;
          }
        };
        if (typeof QRCode !== "undefined") createCode();
        else {
          const script = document.createElement("script");
          script.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
          script.onload = createCode;
          script.onerror = createCode;
          document.head.appendChild(script);
        }
      }

      async function digest(value) {
        if (window.crypto && crypto.subtle) {
          const bytes = new TextEncoder().encode(value);
          const hash = await crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, "0")).join("");
        }
        return btoa(unescape(encodeURIComponent(value)));
      }
      function authMarkup(isFirst) {
        return `<div class="auth-wrap">
          <p class="notice">${isFirst ? "Create a passphrase to protect the profile editor on this device." : "Enter your passphrase to edit this profile."} <strong>This device-only lock is not account authentication.</strong></p>
          <form id="auth-form">
            <div class="field"><label for="auth-password">${isFirst ? "Create passphrase" : "Passphrase"}</label><input id="auth-password" type="password" minlength="4" autocomplete="${isFirst ? "new-password" : "current-password"}" required placeholder="At least 4 characters"></div>
            ${isFirst ? `<div class="field"><label for="auth-confirm">Confirm passphrase</label><input id="auth-confirm" type="password" minlength="4" autocomplete="new-password" required placeholder="Enter it once more"></div>` : ""}
            <p class="field-error" id="auth-error" role="alert"></p>
            <p class="auth-hint">Your profile is saved only in this browser. Clearing this browser's storage removes its editor lock and saved changes.</p>
            <div class="modal-actions"><button class="primary-button" type="submit">${isFirst ? "Create lock & continue" : "Unlock editor"}</button></div>
          </form>
        </div>`;
      }
      function requestEditor() {
        if (editorUnlocked) { openEditor(); return; }
        const isFirst = !localStorage.getItem(LOCK_KEY);
        openModal(isFirst ? "Set up your editor" : "Your profile editor", authMarkup(isFirst));
        document.getElementById("auth-form").addEventListener("submit", async event => {
          event.preventDefault();
          const pass = document.getElementById("auth-password").value;
          const error = document.getElementById("auth-error");
          if (pass.length < 4) { error.textContent = "Use at least 4 characters."; return; }
          if (isFirst) {
            if (pass !== document.getElementById("auth-confirm").value) { error.textContent = "Those passphrases do not match."; return; }
            try { localStorage.setItem(LOCK_KEY, await digest(pass)); }
            catch (reason) { console.error("Could not set the editor lock.", reason); error.textContent = "The editor lock could not be saved in this browser."; return; }
            editorUnlocked = true;
            openEditor();
          } else {
            const stored = localStorage.getItem(LOCK_KEY);
            if (await digest(pass) !== stored) { error.textContent = "That passphrase is not correct."; return; }
            editorUnlocked = true;
            openEditor();
          }
        });
      }
      function openEditor() {
        const p = state.profile;
        const c = state.contact;
        const markup = `
          <p class="notice">Changes save to this browser and are included in your share link. Uploaded photos stay in this browser; for public visitors, use image URLs. <strong>There is no hosted account or cloud sync.</strong></p>
          <section class="editor-section">
            <div class="editor-title"><strong>Profile</strong></div>
            <div class="form-grid">
              <div class="field"><label for="edit-name">Name</label><input id="edit-name" maxlength="100" value="${escapeAttr(p.name)}" required></div>
              <div class="field"><label for="edit-title">Designation</label><input id="edit-title" maxlength="120" value="${escapeAttr(p.title)}"></div>
              <div class="field"><label for="edit-theme">Profile theme</label><select id="edit-theme"><option value="gold" ${theme === "gold" ? "selected" : ""}>Black &amp; Gold</option><option value="white" ${theme === "white" ? "selected" : ""}>Minimal White</option><option value="blue" ${theme === "blue" ? "selected" : ""}>Midnight Blue</option><option value="charcoal" ${theme === "charcoal" ? "selected" : ""}>Modern Charcoal</option></select></div>
              <div class="field"><label for="edit-org">Organisation</label><input id="edit-org" maxlength="100" value="${escapeAttr(p.organization)}"></div>
              <div class="field"><label for="edit-location">Location</label><input id="edit-location" maxlength="120" value="${escapeAttr(p.location)}"></div>
              <div class="field full"><label for="edit-bio">Short bio</label><textarea id="edit-bio" maxlength="700">${escapeHtml(p.bio)}</textarea></div>
              <div class="field full"><label for="edit-photo">Profile photo</label><input id="edit-photo" type="file" accept="image/*"><p class="help">Optional. Your uploaded photo remains on this device; alternatively, use a hosted image URL when sharing.</p></div>
              <div class="field full"><label for="edit-photo-url">Profile photo URL</label><input id="edit-photo-url" type="url" placeholder="https://…" value="${p.photo.startsWith("data:") || p.photo === "hallo-fluency-logo.png" ? "" : escapeAttr(p.photo)}"></div>
              <div class="field full"><label class="switch"><input id="remove-photo" type="checkbox">Remove current photo</label></div>
            </div>
          </section>
          <section class="editor-section">
            <div class="editor-title"><strong>Social links</strong><button class="primary-button compact" id="add-social" type="button">${icon("plus")} Add link</button></div>
            <div id="social-editor">${renderRows("socials")}</div>
          </section>
          <section class="editor-section">
            <div class="editor-title"><strong>Exam &amp; course registration</strong><button class="primary-button compact" id="add-course" type="button">${icon("plus")} Add link</button></div>
            <div id="course-editor">${renderRows("courses")}</div>
          </section>
          <section class="editor-section">
            <div class="editor-title"><strong>Contact information</strong></div>
            <div class="form-grid">
              <div class="field"><label for="edit-phone">Phone number</label><input id="edit-phone" type="tel" value="${escapeAttr(c.phone)}"></div>
              <div class="field"><label for="edit-whatsapp">WhatsApp number</label><input id="edit-whatsapp" type="tel" value="${escapeAttr(c.whatsapp)}"></div>
              <div class="field"><label for="edit-email">Email address</label><input id="edit-email" type="email" value="${escapeAttr(c.email)}"></div>
              <div class="field"><label for="edit-website">Official website</label><input id="edit-website" type="url" placeholder="https://…" value="${escapeAttr(c.website)}"></div>
              <div class="field full"><label for="edit-address">Business address</label><input id="edit-address" maxlength="180" value="${escapeAttr(c.address)}"></div>
              <div class="field full"><label for="edit-maps">Google Maps / directions URL</label><input id="edit-maps" type="url" placeholder="https://…" value="${escapeAttr(c.maps)}"></div>
              <div class="field full"><label for="edit-footer-url">ALO website URL (optional)</label><input id="edit-footer-url" type="url" placeholder="https://…" value="${escapeAttr(state.footerUrl)}"></div>
            </div>
          </section>
          <p class="field-error" id="editor-error" role="alert"></p>
          <div class="modal-actions"><button class="secondary-button" id="lock-editor" type="button">Lock editor</button><button class="primary-button" id="save-profile" type="button">Save profile</button></div>`;
        openModal("Edit your profile", markup);
        document.getElementById("add-social").addEventListener("click", () => {
          state.socials.push({ platform: "Instagram", title: "Instagram", url: "", enabled: true });
          refreshEditorRows("socials");
        });
        document.getElementById("add-course").addEventListener("click", () => {
          state.courses.push({ type: "exam", title: "", description: "", image: "", url: "", deadline: "", status: "Open" });
          refreshEditorRows("courses");
        });
        document.getElementById("save-profile").addEventListener("click", saveEditor);
        document.getElementById("lock-editor").addEventListener("click", () => { editorUnlocked = false; closeModal(); });
        bindRowActions();
      }
      function renderRows(type) {
        const items = state[type];
        if (!items.length) return `<div class="empty-note">No ${type === "socials" ? "social links" : "courses"} added yet.</div>`;
        return items.map((item, index) => {
          const title = type === "socials" ? (item.title || item.platform || "Untitled link") : (item.title || "Untitled registration");
          const detail = type === "socials"
            ? (item.url || "Add a URL")
            : `${item.type === "exam" ? "Exam" : "Course"} · ${item.status}${item.url ? ` · ${item.url}` : ""}`;
          const enabled = type !== "socials" ? "" : `<label class="switch"><input type="checkbox" data-toggle="${index}" ${item.enabled ? "checked" : ""}>Show</label>`;
          return `<div class="editor-row">
            <div><span class="editor-row-title">${escapeHtml(title)}</span><span class="editor-row-sub">${escapeHtml(detail)}</span></div>
            <div class="row-actions">${enabled}
              <button class="mini-button" type="button" data-action="up" data-index="${index}" aria-label="Move up" ${index === 0 ? "disabled" : ""}>${icon("up")}</button>
              <button class="mini-button" type="button" data-action="down" data-index="${index}" aria-label="Move down" ${index === items.length - 1 ? "disabled" : ""}>${icon("down")}</button>
              <button class="mini-button" type="button" data-action="edit" data-index="${index}" aria-label="Edit ${escapeAttr(title)}">${icon("edit")}</button>
              <button class="mini-button danger" type="button" data-action="delete" data-index="${index}" aria-label="Delete ${escapeAttr(title)}">${icon("trash")}</button>
            </div>
          </div>`;
        }).join("");
      }
      function refreshEditorRows(type) {
        const target = document.getElementById(type === "socials" ? "social-editor" : "course-editor");
        target.innerHTML = renderRows(type);
        bindRowActions();
      }
      function bindRowActions() {
        modalContent.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", () => {
          const type = document.getElementById("social-editor").contains(button) ? "socials" : "courses";
          const index = Number(button.dataset.index);
          const list = state[type];
          if (button.dataset.action === "delete") {
            list.splice(index, 1);
            refreshEditorRows(type);
          } else if (button.dataset.action === "up" || button.dataset.action === "down") {
            const destination = index + (button.dataset.action === "up" ? -1 : 1);
            if (destination >= 0 && destination < list.length) [list[index], list[destination]] = [list[destination], list[index]];
            refreshEditorRows(type);
          } else if (type === "socials") {
            editSocial(index);
          } else {
            editCourse(index);
          }
        }));
        modalContent.querySelectorAll("[data-toggle]").forEach(input => input.addEventListener("change", () => {
          state.socials[Number(input.dataset.toggle)].enabled = input.checked;
        }));
      }
      function editSocial(index) {
        const item = state.socials[index];
        const options = PLATFORMS.map(([name]) => `<option value="${escapeAttr(name)}" ${item.platform === name ? "selected" : ""}>${escapeHtml(name)}</option>`).join("");
        openModal("Edit social link", `<form id="item-form">
          <div class="form-grid">
            <div class="field"><label for="social-platform">Platform</label><select id="social-platform">${options}</select></div>
            <div class="field"><label for="social-title">Link title</label><input id="social-title" maxlength="60" required value="${escapeAttr(item.title)}"></div>
            <div class="field full"><label for="social-url">Profile URL</label><input id="social-url" type="url" required placeholder="https://…" value="${escapeAttr(item.url)}"><p class="help">Enter a full link beginning with https:// or http://.</p></div>
          </div><p class="field-error" id="item-error" role="alert"></p>
          <div class="modal-actions"><button class="secondary-button" type="button" id="item-cancel">Cancel</button><button class="primary-button" type="submit">Save link</button></div>
        </form>`);
        document.getElementById("item-cancel").addEventListener("click", openEditor);
        document.getElementById("item-form").addEventListener("submit", event => {
          event.preventDefault();
          const url = safeUrl(document.getElementById("social-url").value);
          if (!url) { document.getElementById("item-error").textContent = "Enter a valid http:// or https:// URL."; return; }
          item.platform = document.getElementById("social-platform").value;
          item.title = document.getElementById("social-title").value.trim();
          item.url = url;
          openEditor();
        });
      }
      function editCourse(index) {
        const item = state.courses[index];
        openModal("Edit registration link", `<form id="item-form">
          <div class="form-grid">
            <div class="field"><label for="course-type-input">Registration type</label><select id="course-type-input"><option value="exam" ${item.type === "exam" ? "selected" : ""}>Exam registration</option><option value="course" ${item.type === "course" ? "selected" : ""}>Course registration</option></select></div>
            <div class="field"><label for="course-title-input">Card title</label><input id="course-title-input" maxlength="120" required value="${escapeAttr(item.title)}"></div>
            <div class="field full"><label for="course-description-input">Description</label><textarea id="course-description-input" maxlength="500">${escapeHtml(item.description)}</textarea></div>
            <div class="field"><label for="course-status-input">Registration status</label><select id="course-status-input"><option ${item.status === "Open" ? "selected" : ""}>Open</option><option ${item.status === "Closed" ? "selected" : ""}>Closed</option></select></div>
            <div class="field"><label for="course-deadline-input">Registration deadline</label><input id="course-deadline-input" type="date" value="${escapeAttr(item.deadline)}"></div>
            <div class="field full"><label for="course-url-input">Registration URL</label><input id="course-url-input" type="url" required placeholder="https://…" value="${escapeAttr(item.url)}"></div>
            <div class="field full"><label for="course-image-url">Thumbnail image URL</label><input id="course-image-url" type="url" placeholder="https://…" value="${item.image.startsWith("data:") ? "" : escapeAttr(item.image)}"></div>
            <div class="field full"><label for="course-image-file">Or upload a thumbnail</label><input id="course-image-file" type="file" accept="image/*"></div>
            <div class="field full"><label class="switch"><input id="remove-course-image" type="checkbox">Remove current thumbnail</label></div>
          </div><p class="field-error" id="item-error" role="alert"></p>
          <div class="modal-actions"><button class="secondary-button" type="button" id="item-cancel">Cancel</button><button class="primary-button" type="submit">Save link</button></div>
        </form>`);
        document.getElementById("item-cancel").addEventListener("click", openEditor);
        document.getElementById("item-form").addEventListener("submit", async event => {
          event.preventDefault();
          const url = safeUrl(document.getElementById("course-url-input").value);
          if (!url) { document.getElementById("item-error").textContent = "Enter a valid http:// or https:// registration URL."; return; }
          const imageUrl = document.getElementById("course-image-url").value.trim();
          if (imageUrl && !safeUrl(imageUrl)) { document.getElementById("item-error").textContent = "Enter a valid http:// or https:// thumbnail URL."; return; }
          const file = document.getElementById("course-image-file").files[0];
          let image = imageUrl || item.image;
          if (document.getElementById("remove-course-image").checked) image = "";
          if (file) {
            try { image = await readImage(file); }
            catch (error) { console.error("Could not read the course image.", error); document.getElementById("item-error").textContent = error.message; return; }
          }
          Object.assign(item, {
            type: document.getElementById("course-type-input").value,
            title: document.getElementById("course-title-input").value.trim(),
            description: document.getElementById("course-description-input").value.trim(),
            url, image, deadline: document.getElementById("course-deadline-input").value,
            status: document.getElementById("course-status-input").value
          });
          openEditor();
        });
      }
      function readImage(file) {
        return new Promise((resolve, reject) => {
          if (!file.type.startsWith("image/")) { reject(new Error("Choose an image file.")); return; }
          if (file.size > 8 * 1024 * 1024) { reject(new Error("Choose an image smaller than 8 MB.")); return; }
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("The selected image could not be read."));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error("The selected image is not valid."));
            img.onload = () => {
              const max = 560;
              const scale = Math.min(1, max / Math.max(img.width, img.height));
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(img.width * scale));
              canvas.height = Math.max(1, Math.round(img.height * scale));
              canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", .72));
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }
      async function saveEditor() {
        const error = document.getElementById("editor-error");
        const photoUrl = document.getElementById("edit-photo-url").value.trim();
        const website = document.getElementById("edit-website").value.trim();
        const maps = document.getElementById("edit-maps").value.trim();
        const footerUrl = document.getElementById("edit-footer-url").value.trim();
        if (photoUrl && !safeUrl(photoUrl)) { error.textContent = "Enter a valid photo URL beginning with http:// or https://."; return; }
        if (website && !safeUrl(website)) { error.textContent = "Enter a valid website URL beginning with http:// or https://."; return; }
        if (maps && !safeUrl(maps)) { error.textContent = "Enter a valid directions URL beginning with http:// or https://."; return; }
        if (footerUrl && !safeUrl(footerUrl)) { error.textContent = "Enter a valid ALO website URL beginning with http:// or https://."; return; }
        const email = document.getElementById("edit-email").value.trim();
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { error.textContent = "Enter a valid email address."; return; }
        const photoFile = document.getElementById("edit-photo").files[0];
        let photo = photoUrl || state.profile.photo;
        if (document.getElementById("remove-photo").checked) photo = "";
        if (photoFile) {
          try { photo = await readImage(photoFile); }
          catch (reason) { console.error("Could not read the profile photo.", reason); error.textContent = reason.message; return; }
        }
        if (!photoUrl && !photoFile && state.profile.photo.startsWith("data:")) photo = state.profile.photo;
        state.profile = {
          name: document.getElementById("edit-name").value.trim() || DEFAULT.profile.name,
          title: document.getElementById("edit-title").value.trim(),
          bio: document.getElementById("edit-bio").value.trim(),
          organization: document.getElementById("edit-org").value.trim(),
          location: document.getElementById("edit-location").value.trim(),
          photo, initials: initials(document.getElementById("edit-name").value)
        };
        state.contact = {
          phone: document.getElementById("edit-phone").value.trim(),
          whatsapp: document.getElementById("edit-whatsapp").value.trim(),
          email, website: safeUrl(website), address: document.getElementById("edit-address").value.trim(),
          maps: safeUrl(maps)
        };
        state.footerUrl = safeUrl(footerUrl);
        theme = document.getElementById("edit-theme").value;
        if (!persist()) return;
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (reason) {
          console.error("Could not save the selected theme.", reason);
          showToast("Profile saved, but the selected theme may not persist.");
        }
        closeModal();
        render();
        showToast("Your profile is saved on this device.");
      }

      document.getElementById("modal-close").addEventListener("click", closeModal);
      backdrop.addEventListener("click", event => { if (event.target === backdrop) closeModal(); });
      document.addEventListener("keydown", event => { if (event.key === "Escape" && backdrop.classList.contains("open")) closeModal(); });
      window.addEventListener("hashchange", () => { state = loadState(); render(); });
      render();
    })();
  </script>
</body>
</html>
